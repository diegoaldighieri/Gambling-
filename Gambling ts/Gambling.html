<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Caccia al tesoro</title>
    <script src="code/Gambling.js" defer></script>
    <link rel="stylesheet" href="styles/Gambling.css"/>
</head>
<body>
<div id="main-content">
    <h2>Caramelle: <span id="caramelle"></span></h2>

    <div>
        <button id="Versione1">Versione 1</button>
        <button id="Versione2">Versione 2</button>
        <button id="Versione3">Versione 3</button>
    </div>

    <button id="start">Comincia la caccia</button>

    <div id="grid"></div>

    <div id="overlay">
        <div id="popup">
            <h2>💣 BOMBOCLAT HAI PERSO 💣</h2>
            <button onclick="closePopup()">Chiudi</button>
        </div>
    </div>
    <div id="overlay2">
        <div id="popup2">
            <h2>💎 BOMBOCLAT HAI VINTO 💎</h2>
            <button onclick="closePopup()">Chiudi</button>
        </div>
    </div>
    <div id="overlay3">
        <div id="popup3">
            <h2>NO BALLS</h2>
            <button onclick="closePopup()">Chiudi</button>
        </div>
    </div>
</div>
<div id="scomm/vinc">
    <label for="scommessa">Inserisci la tua puntata</label>
    <input type="number" id="scommessa" />
    <button id="somma5">+5</button>
    <button id="somma10">+10</button>
    <button id="somma50">+50</button>
    <button id="somma100">+100</button>
    <h2>Moltiplicatore: <span id="moltiplicatore"></span></h2>
    <h2>Vincita al momento: <span id="vincita"></span></h2>
    <button id="accontentati">CI ACCONTENTIAMO</button>
</div>
</body>
</html>
