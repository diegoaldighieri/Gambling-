<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💎 Caccia al Tesoro</title>
    <link rel="stylesheet" href="styles/Gambling.css" />
    <script src="code/Gambling.js" defer></script>
</head>
<body>
<!-- Cambio tema -->
<div id="theme-switcher">
    <button id="theme-button" aria-label="Cambia tema">🎨</button>
    <div id="theme-menu" class="hidden">
        <div class="theme-menu-title">Scegli Tema</div>
        <button class="theme-option" data-theme="default">
            <span class="theme-preview" style="background: linear-gradient(135deg, #ffc400, #00cc66)"></span>
            <span>Classico</span>
        </button>
        <button class="theme-option" data-theme="dark">
            <span class="theme-preview" style="background: linear-gradient(135deg, #60a5fa, #a78bfa)"></span>
            <span>Scuro</span>
        </button>
        <button class="theme-option" data-theme="neon">
            <span class="theme-preview" style="background: linear-gradient(135deg, #ec4899, #06b6d4)"></span>
            <span>Neon</span>
        </button>
        <button class="theme-option" data-theme="forest">
            <span class="theme-preview" style="background: linear-gradient(135deg, #10b981, #34d399)"></span>
            <span>Foresta</span>
        </button>
        <button class="theme-option" data-theme="sunset">
            <span class="theme-preview" style="background: linear-gradient(135deg, #f59e0b, #ef4444)"></span>
            <span>Tramonto</span>
        </button>
        <button class="theme-option" data-theme="ocean">
            <span class="theme-preview" style="background: linear-gradient(135deg, #0ea5e9, #06b6d4)"></span>
            <span>Oceano</span>
        </button>
    </div>
</div>

<!-- Container Principale -->
<div class="game-container">

    <!-- Header con soldi -->
    <header class="game-header">
        <div class="balance-display">
            <span class="balance-label">💰 Saldo</span>
            <span class="balance-amount"><span id="caramelle"></span> 💵</span>
        </div>
    </header>

    <!-- Layout a due colonne -->
    <div class="game-layout">

        <!-- Colonna Sinistra: Controlli -->
        <aside class="controls-panel">

            <!-- Sezione Versioni -->
            <section class="control-section">
                <h3 class="section-title">Seleziona Difficoltà</h3>
                <div class="version-buttons">
                    <button id="Versione1" class="version-btn">
                        <span class="version-number">3×3</span>
                        <span class="version-label">Facile</span>
                    </button>
                    <button id="Versione2" class="version-btn">
                        <span class="version-number">4×4</span>
                        <span class="version-label">Medio</span>
                    </button>
                    <button id="Versione3" class="version-btn">
                        <span class="version-number">5×5</span>
                        <span class="version-label">Difficile</span>
                    </button>
                </div>
            </section>

            <!-- Sezione Scommessa -->
            <section class="control-section">
                <h3 class="section-title">Imposta Puntata</h3>
                <div class="bet-input-wrapper">
                    <input type="number" id="scommessa" placeholder="0" />
                </div>
                <div class="bet-buttons">
                    <button id="somma5" class="bet-btn">+5</button>
                    <button id="somma10" class="bet-btn">+10</button>
                    <button id="somma50" class="bet-btn">+50</button>
                    <button id="somma100" class="bet-btn">+100</button>
                </div>
                <button id="maxbet" class="max-bet-btn">MAX BET</button>
            </section>

            <!-- Sezione Vincita-Moltiplicatore -->
            <section class="control-section info-section">
                <div class="info-row">
                    <span class="info-label">Moltiplicatore</span>
                    <span class="info-value">×<span id="moltiplicatore"></span></span>
                </div>
                <div class="info-row highlight">
                    <span class="info-label">Vincita Potenziale</span>
                    <span class="info-value"><span id="vincita"></span> 💵</span>
                </div>
            </section>

            <!-- Pulsanti Inizio-Ritira -->
            <div class="action-buttons">
                <button id="start" class="action-btn primary-btn">
                    🎮 INIZIA PARTITA
                </button>
                <button id="accontentati" class="action-btn secondary-btn">
                    💰 RITIRA VINCITA
                </button>
            </div>

        </aside>

        <!-- Colonna Destra: Griglia di Gioco -->
        <main class="game-area">
            <div class="grid-wrapper">
                <div id="grid"></div>
            </div>
        </main>

    </div>
</div>

<!-- Overlay Sconfitta -->
<div id="overlay" class="overlay">
    <div id="popup" class="popup popup-lose">
        <div class="popup-icon">💣</div>
        <h2 class="popup-title">HAI PERSO!</h2>
        <p class="popup-message">La bomba ti ha fatto saltare in aria!</p>
        <button onclick="closePopup()" class="popup-btn">Riprova</button>
    </div>
</div>

<!-- Overlay Vittoria -->
<div id="overlay2" class="overlay">
    <div id="popup2" class="popup popup-win">
        <div class="popup-icon">💎</div>
        <h2 class="popup-title">HAI VINTO!</h2>
        <p class="popup-message">Hai trovato tutti i tesori!</p>
        <button onclick="closePopup()" class="popup-btn">Mi Bombo!</button>
    </div>
</div>

<!-- Overlay Cashout -->
<div id="overlay3" class="overlay">
    <div id="popup3" class="popup popup-cashout">
        <div class="popup-icon">💰</div>
        <h2 class="popup-title">VINCITA RITIRATA!</h2>
        <p class="popup-message">Hai incassato la tua vincita!</p>
        <button onclick="closePopup()" class="popup-btn">Perfetto!</button>
    </div>
</div>

</body>
</html>
